name: edusync
description: "EduSync - A Web-based Activity and Grade Management System for Teachers and Students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  path_provider: ^2.1.4
  flutter_slidable: ^3.1.1
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  http: ^1.6.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^18.0.1
  shorebird_code_push: ^2.0.7
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
