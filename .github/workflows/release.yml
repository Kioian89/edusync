name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.4.3'
      build_type:
        description: 'Build an APK, publish a release, or publish a Shorebird patch'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - release
          - patch

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -y
          echo "Disk after cleanup:"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Ensure Android Platforms & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "platforms;android-34" "ndk;28.2.13676358" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Publish Shorebird OTA Patch
        if: "${{ github.event.inputs.build_type == 'patch' }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -o pipefail
          DART_DEFINES=""
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            DART_DEFINES="--dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          fi
          shorebird patch android \
            --allow-asset-diffs \
            --allow-native-diffs \
            $DART_DEFINES 2>&1 | tee build_log.txt

      - name: Build APK (Release / Shorebird)
        if: "${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            DART_DEFINES="--dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          fi

          BUILD_SUCCESS=false
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            echo "Attempting Shorebird base release APK..."
            shorebird release android --artifact=apk $DART_DEFINES --split-debug-info=symbols/ 2>&1 | tee build_log.txt
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              echo "✅ Shorebird release build completed successfully."
              BUILD_SUCCESS=true
            else
              echo "⚠️ Shorebird failed (exit ${PIPESTATUS[0]}) — falling back to standard Flutter release build..."
            fi
          fi

          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "Running standard Flutter release build..."
            flutter build apk --release $DART_DEFINES --obfuscate --split-debug-info=symbols/ 2>&1 | tee build_log.txt
          fi

      - name: Build APK (Artifact Only)
        if: "${{ github.event.inputs.build_type == 'build' }}"
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt

      - name: Upload Failure Log
        if: "${{ failure() && (github.event_name == 'push' || github.event.inputs.build_type == 'release') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Build Log - ${{ github.event.inputs.version_tag || github.ref_name }}
          files: build_log.txt
          body: "Release build failed on GitHub Actions runner. Build log attached."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK to edusync.apk
        if: "${{ github.event.inputs.build_type != 'patch' }}"
        run: |
          mkdir -p build/app/outputs/flutter-apk
          FOUND_APK=$(find build -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            echo "Found APK at: $FOUND_APK"
            cp "$FOUND_APK" build/app/outputs/flutter-apk/edusync.apk
            echo "Successfully staged APK at build/app/outputs/flutter-apk/edusync.apk"
          else
            echo "No APK found in build directory!"
            find build -maxdepth 4 || true
            exit 1
          fi

      - name: Publish GitHub Release
        if: "${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.version_tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/edusync.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        if: "${{ success() && github.event.inputs.build_type == 'build' }}"
        uses: actions/upload-artifact@v4
        with:
          name: edusync-android-apk
          path: build/app/outputs/flutter-apk/edusync.apk
          if-no-files-found: error

      - name: Clean up diagnostic log on success
        if: "${{ success() && (github.event_name == 'push' || github.event.inputs.build_type == 'release') }}"
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          LOG_ASSET_ID=$(echo "$RELEASE_INFO" | python3 -c "import sys, json; data=json.load(sys.stdin); print(next((a['id'] for a in data.get('assets', []) if a['name'] == 'build_log.txt'), ''))" 2>/dev/null || true)
          if [ -n "$LOG_ASSET_ID" ]; then
            echo "Removing previous diagnostic build_log.txt (asset $LOG_ASSET_ID)..."
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$LOG_ASSET_ID"
          fi
