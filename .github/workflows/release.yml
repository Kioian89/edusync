name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.0.3'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Ensure Android Platforms & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "platforms;android-34" "ndk;28.2.13676358" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt

      - name: Upload Failure Log
        if: failure()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Build Log - ${{ github.event.inputs.version_tag || github.ref_name }}
          files: build_log.txt
          body: "Release build failed on GitHub Actions runner. Build log attached."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.version_tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
